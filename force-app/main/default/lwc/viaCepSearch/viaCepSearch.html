<template>
    <lightning-card icon-name="utility:search" title="Buscar Endereço por CEP">
        
        <div class="slds-p-around_medium">

            <!-- Campo de CEP com botão de busca -->
            <lightning-layout multiple-rows>
                <lightning-layout-item size="10">
                    <lightning-input label="CEP" value={cep} onchange={handleCepChange} placeholder="Digite o CEP" max-length="8"></lightning-input>
                </lightning-layout-item>
                <lightning-layout-item size="2" class="slds-p-top_large">
                    <lightning-button-icon icon-name="utility:search" alternative-text="Buscar CEP" onclick={handleSearchCep} variant="brand" class="slds-float_right"></lightning-button-icon>
                </lightning-layout-item>
            </lightning-layout>

            <!-- Campos sempre visíveis -->
            <lightning-layout multiple-rows class="slds-m-top_medium">
                <lightning-layout-item size="9" class="slds-p-right_small">
                    <lightning-input label="Rua" value={endereco.logradouro} disabled></lightning-input>
                </lightning-layout-item>
                <lightning-layout-item size="3">
                    <lightning-input label="Número" value={numero} onchange={handleNumberChange} type="text" max-length="10">></lightning-input>
                </lightning-layout-item>
                <lightning-layout-item size="6" class="slds-p-right_small">
                    <lightning-input label="Bairro" value={endereco.bairro} disabled></lightning-input>
                </lightning-layout-item>
                <lightning-layout-item size="6">
                    <lightning-input label="Cidade" value={endereco.localidade} disabled></lightning-input>
                </lightning-layout-item>        
                <lightning-layout-item size="6" class="slds-p-top_small slds-p-right_small">
                    <lightning-input label="Estado" value={endereco.uf} disabled></lightning-input>
                </lightning-layout-item>           
                <lightning-layout-item size="6" class="slds-p-top_small">
                    <lightning-input label="Região" value={endereco.regiao} disabled></lightning-input>
                </lightning-layout-item>
            </lightning-layout>
            

            <!-- Erro -->
            <template if:true={erro}>
                <div class="slds-text-color_error slds-m-top_small">{erro}</div>
            </template>

            <!-- Botões -->
            <div class="slds-m-top_large slds-grid slds-grid_align-end">
                <lightning-button variant="destructive" label="Cancelar" onclick={handleCancel} class="slds-m-left_x-small"></lightning-button>
                <lightning-button variant="brand" label="Salvar" onclick={handleSave} class="slds-m-left_x-small"></lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
